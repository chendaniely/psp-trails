name: Publish website

# Rebuilds the map from the committed OSM snapshot in data/raw (no downloads
# here: the public Overpass servers are too flaky for CI), renders the Quarto
# site in website/, and pushes it to the gh-pages branch.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # push the built site to gh-pages

concurrency:
  group: publish-website
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0 # no moving major tag for this action
        with:
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest -q

      - name: Apply our edits and build the map (steps 04-05)
        run: |
          uv run python 04_apply_manual_edits.py
          uv run python 05_map_trails.py
          cp output/trail_map.html website/trail_map.html
          cp output/labels.geojson website/labels.geojson
          cp output/amenities.geojson website/amenities.geojson

      - name: Check trail connections (step 06); stop if any fail
        run: |
          uv run python 06_check_connections.py
          if grep -E ",(DETOUR|NOT CONNECTED)," output/connection_check.csv; then
            echo "::error::A trail connection is broken; see the table above"
            exit 1
          fi

      - name: Generate routes from the Park Centre (step 07)
        run: |
          uv run python 07_generate_routes.py
          cp data/processed/routes.geojson data/processed/coverage.json website/

      - name: Plan the every-trail ultra (step 08)
        run: |
          uv run python 08_plan_ultra.py
          cp data/processed/ultra.json website/

      - name: The same for bikes (steps 07 and 08, MODE=bike)
        run: |
          MODE=bike uv run python 07_generate_routes.py
          MODE=bike uv run python 08_plan_ultra.py
          cp data/processed/bike_routes.geojson data/processed/bike_ultra.json website/

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render and publish to gh-pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
          path: website
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
