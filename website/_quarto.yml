project:
  type: website
  # The map (step 05) and routes (step 07) are built by the Python pipeline
  # and copied in by `make website` locally, or by the GitHub Action.
  resources:
    - trail_map.html
    - routes.geojson
    - labels.geojson

website:
  title: "Pacific Spirit Trails"
  site-url: https://pstrunners.github.io/
  repo-url: https://github.com/pstrunners/pstrunners.github.io
  page-navigation: false
  navbar:
    left:
      - href: index.qmd
        text: Map
      - href: routes.qmd
        text: Routes
      - href: about.qmd
        text: About
    right:
      - href: trail_map.html
        text: Full-screen map
      - icon: github
        href: https://github.com/pstrunners/pstrunners.github.io
        aria-label: Source code on GitHub

format:
  html:
    theme: cosmo
    css: styles.css
