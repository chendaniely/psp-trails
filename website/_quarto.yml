project:
  type: website
  # The map (step 05) and routes (step 07) are built by the Python pipeline
  # and copied in by `make website` locally, or by the GitHub Action.
  resources:
    - trail_map.html
    - routes.geojson
    - labels.geojson
    - amenities.geojson
    - amenities.js
    - ultra.json
    - coverage.json
    - bike_routes.geojson
    - bike_ultra.json

website:
  title: "Pacific Spirit Trail Runners"
  site-url: https://pstrunners.github.io/
  repo-url: https://github.com/pstrunners/pstrunners.github.io
  page-navigation: false
  navbar:
    left:
      - href: index.qmd
        text: Home
      - href: rotd.qmd
        text: ROTD
      - href: routes.qmd
        text: Routes
      - href: ultra.qmd
        text: Ultra
      - href: bikes.qmd
        text: Bikes
    right:
      - href: map.qmd
        text: Map
      - href: trail_map.html
        text: Full-screen map
        target: _blank
      - href: about.qmd
        text: About
      - icon: github
        href: https://github.com/pstrunners/pstrunners.github.io
        aria-label: Source code on GitHub

format:
  html:
    theme: cosmo
    css: styles.css
